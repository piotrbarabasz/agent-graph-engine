[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-graph-engine"
version = "0.1.0"
description = "Deterministic graph execution core for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agent Graph Engine contributors" }]
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgraph"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
